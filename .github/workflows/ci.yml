name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GNU Make (Linux)
        if: runner.os == 'Linux'
        run: |
          pushd /tmp
          wget 'https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz'
          tar xzf make-4.4.1.tar.gz
          cd make-4.4.1
          ./configure --prefix=/usr/local
          sudo make install
          popd

      - name: Set up GNU Make (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify GNU Make version
        run: |
          make --version

      - name: Run test suite and installation check
        run: |
          export TMPDIR=$(mktemp -d)
          make PREFIX="${TMPDIR}/" test install
