name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Packages and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GNU Make
        run: |
          pushd /tmp
          wget 'https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz'
          tar xzf make-4.4.1.tar.gz
          cd make-4.4.1
          ./configure --prefix=/usr/local
          sudo make install
          popd

      - name: Build distribution packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make package VERSION="${VERSION}"

      - name: Stage release artefacts
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artefacts
          cp dist/bmakelib-portable.tar.gz \
             dist/*.rpm \
             dist/*.deb \
             artefacts/
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" artefacts/* \
            --title "${TAG}" \
            --draft \
            --generate-notes
